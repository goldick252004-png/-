<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Russo';src:url(fonts/russo-cyr.woff2);unicode-range:U+0400-045F,U+2116;}
@font-face{font-family:'Russo';src:url(fonts/russo-lat.woff2);unicode-range:U+0000-00FF,U+2000-206F;}
@font-face{font-family:'Osw';src:url(fonts/oswald-cyr.woff2);font-weight:200 700;unicode-range:U+0400-045F,U+2116;}
@font-face{font-family:'Osw';src:url(fonts/oswald-lat.woff2);font-weight:200 700;unicode-range:U+0000-00FF,U+2000-206F;}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,FPS=25;
const C={red:'#E30613',redD:'#A3040F',redDD:'#5E020A',navy:'#283A8E',navyD:'#18245E',navyDD:'#0B1236',gold:'#FFC83D',goldD:'#E89A10',white:'#FFFFFF',snow:'#EEF3FF'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const IMG={};
function load(n,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[n]=i;r()};i.src=src;});}

// ---------- utils ----------
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-clamp(t),3);
const eIn=t=>Math.pow(clamp(t),3);
const eInOut=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const eBack=t=>{t=clamp(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const prog=(t,a,d)=>clamp((t-a)/d);

function starPts(cx,cy,R,r,rot){const p=[];for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}return p;}
function poly(p){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();}

// engraved (hatched) star like the CSKA crest
function hatchedStar(cx,cy,R,rot,opt={}){
  const light=opt.light||C.red,dark=opt.dark||C.redD,line=opt.line||C.navy,outline=opt.outline??C.navy;
  const r=R*0.42,P=starPts(cx,cy,R,r,rot),rnd=rng(opt.seed||7);
  if(outline){ctx.save();poly(starPts(cx,cy,R*1.06,r*1.06,rot));ctx.fillStyle=outline;ctx.fill();ctx.restore();}
  for(let i=0;i<10;i+=2){
    const o=P[i],l=P[(i+9)%10],rr=P[(i+1)%10];
    // light facet
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(o[0],o[1]);ctx.lineTo(l[0],l[1]);ctx.closePath();ctx.fillStyle=light;ctx.fill();
    ctx.strokeStyle=light;ctx.lineWidth=1.5;ctx.stroke();
    // dark facet
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(o[0],o[1]);ctx.lineTo(rr[0],rr[1]);ctx.closePath();ctx.fillStyle=dark;ctx.fill();ctx.stroke();
    // hatch strokes on dark facet: from edge o->rr inward toward center
    ctx.save();ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(o[0],o[1]);ctx.lineTo(rr[0],rr[1]);ctx.closePath();ctx.clip();
    ctx.strokeStyle=line;ctx.lineCap='round';
    const n=Math.max(10,Math.round(R/9));
    for(let k=1;k<n;k++){const u=k/n,ex=lerp(o[0],rr[0],u),ey=lerp(o[1],rr[1],u);const len=0.25+0.5*rnd();
      ctx.lineWidth=Math.max(1.2,R/90)*(0.6+0.8*rnd());ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(lerp(ex,cx,len),lerp(ey,cy,len));ctx.stroke();}
    ctx.restore();
    // a few strokes on light facet near the tip (engraving feel)
    ctx.save();ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(o[0],o[1]);ctx.lineTo(l[0],l[1]);ctx.closePath();ctx.clip();
    ctx.strokeStyle=line;for(let k=1;k<n*0.6;k++){const u=k/n,ex=lerp(o[0],l[0],u),ey=lerp(o[1],l[1],u);const len=0.08+0.18*rnd();
      ctx.lineWidth=Math.max(1,R/120);ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(lerp(ex,cx,len),lerp(ey,cy,len));ctx.stroke();}
    ctx.restore();
  }
}
function rays(cx,cy,n,rot,c1,c2,len=3000){for(let i=0;i<n;i++){const a0=rot+i*2*Math.PI/n,a1=a0+Math.PI/n;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a0)*len,cy+Math.sin(a0)*len);ctx.lineTo(cx+Math.cos(a1)*len,cy+Math.sin(a1)*len);ctx.closePath();ctx.fillStyle=i%2?c2:c1;ctx.fill();}}
function vgrad(stops,y0=0,y1=H){const g=ctx.createLinearGradient(0,y0,0,y1);stops.forEach((s,i)=>g.addColorStop(s[0],s[1]));return g;}
function text(s,x,y,o={}){ctx.save();ctx.font=o.font||'80px Russo';ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'alphabetic';
  if(o.ls)ctx.letterSpacing=o.ls+'px';ctx.translate(x,y);if(o.skew)ctx.transform(1,0,o.skew,1,0,0);if(o.scale)ctx.scale(o.scale,o.scale);
  if(o.shadow){ctx.fillStyle=o.shadow;ctx.fillText(s,o.sx||8,o.sy||8);}
  if(o.stroke){ctx.lineJoin='round';ctx.lineWidth=o.sw||10;ctx.strokeStyle=o.stroke;ctx.strokeText(s,0,0);}
  ctx.fillStyle=o.fill||'#fff';ctx.fillText(s,0,0);ctx.restore();}

// snow
const SNOW=(()=>{const r=rng(42),a=[];for(let i=0;i<170;i++)a.push({x:r()*W,y:r()*H,s:1.5+r()*5.5,v:60+r()*140,ph:r()*6.28,amp:10+r()*30});return a;})();
function snow(t,dens=1,alpha=0.9){ctx.save();ctx.fillStyle=C.snow;const n=Math.floor(SNOW.length*dens);
  for(let i=0;i<n;i++){const p=SNOW[i],y=(p.y+t*p.v)%(H+40)-20,x=(p.x+Math.sin(t*1.3+p.ph)*p.amp+W)%W;ctx.globalAlpha=alpha*(0.45+p.s/11);ctx.beginPath();ctx.arc(x,y,p.s,0,7);ctx.fill();}
  ctx.restore();}
// grain
let GRAIN;function makeGrain(){GRAIN=document.createElement('canvas');GRAIN.width=540;GRAIN.height=960;const g=GRAIN.getContext('2d'),d=g.createImageData(540,960),r=rng(3);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);}
function post(t){
  ctx.save();ctx.globalAlpha=0.07;ctx.globalCompositeOperation='overlay';const f=Math.floor(t*FPS);ctx.drawImage(GRAIN,-(f*137)%540,-(f*311)%960,W*2,H*2);ctx.restore();
  const g=ctx.createRadialGradient(W/2,H*0.48,H*0.3,W/2,H*0.5,H*0.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,10,0.55)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function halftone(x0,y0,w,h,color,step=22,maxR=7,dir=1){ctx.save();ctx.fillStyle=color;for(let y=y0;y<y0+h;y+=step)for(let x=x0;x<x0+w;x+=step){const u=dir>0?(y-y0)/h:1-(y-y0)/h;const r=maxR*u;if(r>0.3){ctx.beginPath();ctx.arc(x+((y/step)%2?step/2:0),y,r,0,7);ctx.fill();}}ctx.restore();}

function ball(cx,cy,R,rot){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=R*0.07;ctx.strokeStyle=C.navy;ctx.stroke();
  ctx.save();ctx.beginPath();ctx.arc(0,0,R*0.97,0,7);ctx.clip();
  // central pentagon + seams
  const pent=[];for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;pent.push([Math.cos(a)*R*0.36,Math.sin(a)*R*0.36]);}
  poly(pent);ctx.fillStyle=C.red;ctx.fill();ctx.stroke();
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;ctx.beginPath();ctx.moveTo(pent[i][0],pent[i][1]);ctx.lineTo(Math.cos(a)*R*0.78,Math.sin(a)*R*0.78);ctx.stroke();
    const b=a+Math.PI/5;const q=[[Math.cos(b)*R*0.86,Math.sin(b)*R*0.86],[Math.cos(b-0.32)*R*1.1,Math.sin(b-0.32)*R*1.1],[Math.cos(b+0.32)*R*1.1,Math.sin(b+0.32)*R*1.1]];
    ctx.beginPath();ctx.arc(q[0][0]*1.18,q[0][1]*1.18,R*0.3,0,7);ctx.fillStyle=C.navy;ctx.fill();}
  ctx.restore();
  // shading
  const g=ctx.createRadialGradient(-R*0.35,-R*0.4,R*0.1,0,0,R);g.addColorStop(0,'rgba(255,255,255,0.25)');g.addColorStop(1,'rgba(0,0,40,0.35)');ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fillStyle=g;ctx.fill();
  ctx.restore();}

function badge(name,cx,cy,size,glow=true){const im=IMG['b_'+name];ctx.save();
  if(glow){ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=40;ctx.shadowOffsetY=14;}
  ctx.beginPath();ctx.arc(cx,cy,size/2+10,0,7);ctx.fillStyle=C.gold;ctx.fill();ctx.restore();
  ctx.drawImage(im,cx-size/2,cy-size/2,size,size);}

// ---------- backgrounds ----------
function skyline(baseY,color,seed,scale=1,offx=0){const r=rng(seed);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-50,H);let x=-50+offx;
  while(x<W+60){const w=(40+r()*90)*scale,h=(80+r()*260)*scale;const kind=r();
    ctx.lineTo(x,baseY-h*0.1);ctx.lineTo(x,baseY-h);
    if(kind<0.22){ctx.lineTo(x+w*0.5,baseY-h-w*1.4);} // spire
    else if(kind<0.38){ctx.quadraticCurveTo(x+w*0.5,baseY-h-w*0.9,x+w,baseY-h);} // dome
    ctx.lineTo(x+w,baseY-h);ctx.lineTo(x+w,baseY-h*0.1);x+=w+r()*8;}
  ctx.lineTo(W+60,H);ctx.closePath();ctx.fill();}
function tower(x,baseY,s,color){ // stylised spired tower with star
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x-60*s,baseY);ctx.lineTo(x-60*s,baseY-260*s);ctx.lineTo(x-42*s,baseY-260*s);ctx.lineTo(x-42*s,baseY-380*s);ctx.lineTo(x-30*s,baseY-380*s);ctx.lineTo(x,baseY-560*s);
  ctx.lineTo(x+30*s,baseY-380*s);ctx.lineTo(x+42*s,baseY-380*s);ctx.lineTo(x+42*s,baseY-260*s);ctx.lineTo(x+60*s,baseY-260*s);ctx.lineTo(x+60*s,baseY);ctx.closePath();ctx.fill();
  poly(starPts(x,baseY-590*s,34*s,14*s,0));ctx.fillStyle=C.red;ctx.fill();}

function bgIntro(t){
  ctx.fillStyle=vgrad([[0,'#14205A'],[1,'#070C2A']]);ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=0.9;rays(W/2,800,28,t*0.15,'rgba(227,6,19,0.28)','rgba(40,58,142,0.0)');ctx.restore();
  const s=eBack(prog(t,0.1,1.1));
  hatchedStar(W/2,800,430*s,-0.3*(1-eOut(prog(t,0.1,1.4)))+Math.sin(t*1.2)*0.03,{seed:3});
  halftone(0,1300,W,620,'rgba(227,6,19,0.35)',24,8,1);
}
function bgMoscow(t){
  ctx.fillStyle=vgrad([[0,'#F21622'],[0.55,'#B00611'],[1,'#3D0108']]);ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=1;rays(W/2,880,20,-t*0.1,'rgba(255,220,120,0.10)','rgba(0,0,0,0)');ctx.restore();
  const rise=eOut(prog(t,0,1.6));
  hatchedStar(W/2,lerp(1250,760,rise),360,Math.sin(t*0.8)*0.05,{seed:11,light:'#FF3B3B',dark:C.redD,line:C.navyD});
  const z=1+t*0.015;ctx.save();ctx.translate(W/2,H);ctx.scale(z,z);ctx.translate(-W/2,-H);
  skyline(1250,'#4A0A1C',5,1.1,-t*12);
  tower(170,1230,0.9,'#2B0A2A');tower(910,1250,1.05,'#2B0A2A');
  skyline(1330,C.navyDD,9,1.3,-t*22);
  ctx.restore();
  ctx.fillStyle=vgrad([[0,'rgba(11,18,54,0)'],[1,'rgba(11,18,54,0.95)']],1150,1920);ctx.fillRect(0,1150,W,770);
}
function wave(y,amp,len,ph,fill,crest){ctx.beginPath();ctx.moveTo(-20,H+20);ctx.lineTo(-20,y);
  for(let x=-20;x<=W+20;x+=12)ctx.lineTo(x,y+Math.sin(x/len+ph)*amp+Math.sin(x/(len*0.43)+ph*1.7)*amp*0.35);
  ctx.lineTo(W+20,H+20);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(crest){ctx.strokeStyle=crest;for(let k=0;k<4;k++){ctx.lineWidth=4-k*0.8;ctx.globalAlpha=1-k*0.22;ctx.beginPath();
    for(let x=-20;x<=W+20;x+=12){const yy=y+k*14+Math.sin(x/len+ph)*amp+Math.sin(x/(len*0.43)+ph*1.7)*amp*0.35;x<=-20?ctx.moveTo(x,yy):ctx.lineTo(x,yy);}ctx.stroke();}ctx.globalAlpha=1;}}
function bgVolga(t){
  ctx.fillStyle=vgrad([[0,'#0B1236'],[0.5,'#283A8E'],[0.62,'#6E7FC4']]);ctx.fillRect(0,0,W,H);
  // sun with cut stripes
  const sy=lerp(820,690,eOut(prog(t,0,2)));ctx.save();ctx.beginPath();ctx.arc(W/2+120,sy,250,0,7);ctx.clip();ctx.fillStyle=C.red;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#283A8E';for(let i=0;i<7;i++){const yy=sy+60+i*34;ctx.fillRect(0,yy,W,4+i*3);}ctx.restore();
  // birds / gulls
  ctx.strokeStyle=C.white;ctx.lineWidth=5;ctx.lineCap='round';for(let i=0;i<4;i++){const bx=(150+i*170+t*60)%1200-60,by=420+Math.sin(i*2+t*2)*25+i*40;ctx.beginPath();ctx.moveTo(bx-26,by);ctx.quadraticCurveTo(bx-12,by-16,bx,by);ctx.quadraticCurveTo(bx+12,by-16,bx+26,by);ctx.stroke();}
  const L=[[880,22,90,'#1F2F7A','#9FB0FF',0.6],[960,30,120,'#18245E','#DDE4FF',0.9],[1060,40,140,'#122059',null,1.2],[1180,46,160,'#0E1A4C','#FFFFFF',1.6]];
  L.forEach((l,i)=>{wave(l[0],l[1],l[2],t*l[5]+i,l[3],l[4]);
    if(i==1){ // sailboat
      const bx=W*0.32+Math.sin(t*0.7)*40,by=l[0]+Math.sin(bx/l[2]+t*l[5]+i)*l[1]-8,tilt=Math.cos(bx/l[2]+t*l[5]+i)*0.12;
      ctx.save();ctx.translate(bx,by);ctx.rotate(tilt);ctx.fillStyle=C.navyDD;ctx.beginPath();ctx.moveTo(-120,0);ctx.lineTo(120,0);ctx.lineTo(85,45);ctx.lineTo(-85,45);ctx.closePath();ctx.fill();
      ctx.fillStyle=C.red;ctx.beginPath();ctx.moveTo(-8,-10);ctx.lineTo(-8,-290);ctx.lineTo(-110,-20);ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(4,-10);ctx.lineTo(4,-250);ctx.lineTo(95,-20);ctx.closePath();ctx.fill();
      poly(starPts(-40,-90,22,9,0));ctx.fillStyle='#fff';ctx.fill();ctx.restore();}
  });
  wave(1320,55,180,t*2+5,'#0A1440','#FFFFFF');
  wave(1500,60,200,t*2.4+2,'#070E30','#7F92E8');
  ctx.fillStyle=vgrad([[0,'rgba(7,12,40,0)'],[1,'rgba(7,12,40,0.9)']],1250,1920);ctx.fillRect(0,1250,W,670);
}
const STARS=(()=>{const r=rng(77),a=[];for(let i=0;i<120;i++)a.push([r()*W,r()*1100,1+r()*3,r()*6]);return a;})();
function bgBeams(t){
  ctx.fillStyle=vgrad([[0,'#05081F'],[0.6,'#14205A'],[1,'#283A8E']]);ctx.fillRect(0,0,W,H);
  STARS.forEach(s=>{ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(t*2+s[3]));ctx.fillStyle='#fff';ctx.fillRect(s[0],s[1],s[2],s[2]);});ctx.globalAlpha=1;
  // searchlights
  ctx.save();ctx.globalCompositeOperation='lighter';
  const src=[[120,1240,-0.35,0.9],[380,1240,0.25,1.3],[700,1240,-0.2,1.1],[960,1240,0.4,0.8]];
  const on=eOut(prog(t,0,0.8));
  src.forEach((s,i)=>{const a=-Math.PI/2+s[2]+Math.sin(t*s[3]+i)*0.42,len=1700*on,wd=0.07;
    const g=ctx.createLinearGradient(s[0],s[1],s[0]+Math.cos(a)*len,s[1]+Math.sin(a)*len);g.addColorStop(0,i%2?'rgba(255,90,90,0.75)':'rgba(255,240,200,0.75)');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(s[0]+Math.cos(a-wd)*len,s[1]+Math.sin(a-wd)*len);ctx.lineTo(s[0]+Math.cos(a+wd)*len,s[1]+Math.sin(a+wd)*len);ctx.closePath();ctx.fill();});
  ctx.restore();
  // big star in the sky caught by beams
  hatchedStar(W/2,560,200*eBack(prog(t,0.5,0.9)),t*0.25,{seed:21});
  // arena silhouette
  ctx.fillStyle=C.navyDD;ctx.beginPath();ctx.moveTo(-20,H);ctx.lineTo(-20,1250);ctx.quadraticCurveTo(W/2,1030,W+20,1250);ctx.lineTo(W+20,H);ctx.closePath();ctx.fill();
  ctx.fillStyle=C.red;ctx.fillRect(0,1268,W,14);
  for(let i=0;i<22;i++){const x=20+i*49,y=1205-Math.sin(Math.PI*(x/W))*120+80;ctx.fillStyle=(Math.floor(t*4)+i)%5==0?C.gold:'#FFE9A8';ctx.globalAlpha=0.85;ctx.fillRect(x,y,26,14);}ctx.globalAlpha=1;
  ctx.fillStyle=vgrad([[0,'rgba(11,18,54,0)'],[1,'rgba(11,18,54,0.95)']],1250,1920);ctx.fillRect(0,1250,W,670);
}
function bolt(x0,y0,x1,y1,seed,w){const r=rng(seed);ctx.beginPath();ctx.moveTo(x0,y0);const n=9;for(let i=1;i<n;i++){const u=i/n;ctx.lineTo(lerp(x0,x1,u)+(r()-0.5)*90,lerp(y0,y1,u));}ctx.lineTo(x1,y1);
  ctx.strokeStyle='#fff';ctx.lineWidth=w;ctx.shadowColor='#9FD3FF';ctx.shadowBlur=40;ctx.stroke();ctx.shadowBlur=0;}
function bgStars(t){
  ctx.fillStyle=vgrad([[0,'#0B1236'],[0.5,'#18245E'],[1,'#3B0612']]);ctx.fillRect(0,0,W,H);
  const hit=1.1,ph=eInOut(prog(t,0,hit));
  ctx.save();ctx.globalAlpha=0.6;rays(W/2,760,24,t*0.2,t>hit?'rgba(255,200,61,0.18)':'rgba(255,255,255,0.05)','rgba(0,0,0,0)');ctx.restore();
  const shake=t>hit&&t<hit+0.4?Math.sin(t*90)*14*(1-(t-hit)/0.4):0;
  ctx.save();ctx.translate(shake,0);
  // opponent star (navy/white)
  hatchedStar(lerp(W+400,W*0.70,ph),lerp(520,700,ph),260,0.25-t*0.05,{light:'#3B52B8',dark:C.navyD,line:'#C9D3FF',outline:'#fff',seed:5});
  // CSKA star
  hatchedStar(lerp(-400,W*0.30,ph),lerp(1000,780,ph),300,-0.2+t*0.05,{seed:9});
  ctx.restore();
  if(t>hit-0.05&&t<hit+0.9){const a=1-prog(t,hit,0.9);ctx.save();ctx.globalAlpha=a;bolt(W*0.52,250,W*0.48,1200,Math.floor(t*12),12);ctx.restore();
    ctx.save();ctx.globalAlpha=a*0.85;const g=ctx.createRadialGradient(W/2,740,0,W/2,740,700*(0.4+prog(t,hit,0.5)));g.addColorStop(0,'#fff');g.addColorStop(0.3,'rgba(255,200,61,0.7)');g.addColorStop(1,'rgba(255,200,61,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();}
  // garland
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-20,90);ctx.quadraticCurveTo(W/2,260,W+20,90);ctx.stroke();
  for(let i=0;i<14;i++){const u=i/13,x=lerp(-20,W+20,u),y=(1-u)*(1-u)*90+2*u*(1-u)*260+u*u*90;const cols=[C.red,C.gold,'#fff',C.navy];ctx.fillStyle=cols[(i+Math.floor(t*3))%4];ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=25;ctx.beginPath();ctx.arc(x,y+14,11,0,7);ctx.fill();}
  ctx.restore();
  ctx.fillStyle=vgrad([[0,'rgba(11,18,54,0)'],[1,'rgba(11,18,54,0.95)']],1200,1920);ctx.fillRect(0,1200,W,720);
}
function bgOutro(t){
  ctx.fillStyle=vgrad([[0,C.red],[1,C.redDD]]);ctx.fillRect(0,0,W,H);
  rays(W/2,470,24,t*0.12,'rgba(255,255,255,0.07)','rgba(0,0,0,0)');
  halftone(0,1500,W,420,'rgba(11,18,54,0.45)',24,9,1);
}


// ---------- v2: illustrated scenes ----------
function kb(img,t,d,mode){ // ken burns cover-fit
  const u=clamp(t/d),iw=img.width,ih=img.height,base=Math.max(W/iw,H/ih);
  let z,ox=0,oy=0;
  if(mode==='in'){z=lerp(1.04,1.16,eInOut(u));oy=lerp(0,-40,u);}
  else if(mode==='out'){z=lerp(1.18,1.04,eOut(u));}
  else if(mode==='up'){z=1.12;oy=lerp(90,-90,eInOut(u));}
  else {z=1.10;ox=lerp(-50,50,eInOut(u));}
  const w=iw*base*z,h=ih*base*z;ctx.drawImage(img,(W-w)/2+ox,(H-h)/2+oy,w,h);
}
function shade(top=0.35){ctx.fillStyle=vgrad([[0,'rgba(5,8,30,'+top+')'],[0.12,'rgba(5,8,30,0)']],0,H);ctx.fillRect(0,0,W,H);
  ctx.fillStyle=vgrad([[0,'rgba(5,8,30,0)'],[0.45,'rgba(5,8,30,0.7)'],[1,'rgba(5,8,30,0.96)']],1050,H);ctx.fillRect(0,1050,W,H-1050);}
function logo(name,cx,cy,h,s=1,halo=true){const im=IMG['t_'+name];if(!im||s<=0)return;const hh=h*s,w=hh*im.width/im.height;
  if(halo){const r=Math.max(w,hh)*0.75,g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(255,255,255,0.42)');g.addColorStop(0.55,'rgba(255,255,255,0.14)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(cx-r,cy-r,2*r,2*r);}
  ctx.save();ctx.shadowColor='rgba(255,255,255,0.55)';ctx.shadowBlur=36;ctx.drawImage(im,cx-w/2,cy-hh/2,w,hh);ctx.restore();
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.7)';ctx.shadowBlur=24;ctx.shadowOffsetY=10;ctx.drawImage(im,cx-w/2,cy-hh/2,w,hh);ctx.restore();}
const MATCHES=[
 {home:'cska',away:'univ',hn:'ЦСКА',an:'УНИВЕРСИТЕТ',city:'ИЖЕВСК',day:'1',dow:'ВТОРНИК',isHome:true,bg:'bg_univ',mv:'in'},
 {home:'astr',away:'cska',hn:'АСТРАХАНОЧКА',an:'ЦСКА',city:'АСТРАХАНЬ',day:'9',dow:'СРЕДА',isHome:false,bg:'bg_astr',mv:'up'},
 {home:'cska',away:'luch',hn:'ЦСКА',an:'ЛУЧ',city:'МОСКВА',day:'15',dow:'ВТОРНИК',isHome:true,bg:'bg_luch',mv:'out'},
 {home:'zvezda',away:'cska',hn:'ЗВЕЗДА',an:'ЦСКА',city:'ЗВЕНИГОРОД',day:'23',dow:'СРЕДА',isHome:false,bg:'bg_zvezda',mv:'pan'},
];
function header(t){const a=eOut(prog(t,0.1,0.5));ctx.save();ctx.globalAlpha=a;
  ctx.drawImage(IMG.t_cska,56,70,70,110);
  text('ЖЕНСКИЙ ГК ЦСКА',146,122,{font:'600 38px Osw',align:'left',ls:4});
  text('ДЕКАБРЬ 2026',146,166,{font:'500 30px Osw',align:'left',ls:6,fill:C.gold});ctx.restore();}
function matchFg(t,m,i){
  header(t);
  // logos
  const y=1420,h=270,f=Math.sin(t*2)*6;
  logo(m.home,W/2-235,y+f,h,eBack(prog(t,0.3,0.6)));
  logo(m.away,W/2+235,y-f,h,eBack(prog(t,0.45,0.6)));
  const v=eOut(prog(t,0.7,0.4));if(v>0){ctx.save();ctx.globalAlpha=v;ctx.strokeStyle=C.gold;ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(W/2,y-110*v);ctx.lineTo(W/2,y+110*v);ctx.stroke();ctx.restore();}
  // names
  const n=eOut(prog(t,0.85,0.5));ctx.save();ctx.globalAlpha=n;
  text(m.hn+'  —  '+m.an,W/2,1625+(1-n)*20,{font:'700 46px Osw',ls:3});ctx.restore();
  // date
  const dp=prog(t,1.05,0.5);if(dp>0){const ds=lerp(1.8,1,eOut(dp));ctx.save();ctx.globalAlpha=clamp(dp*3);
    text(m.day+' ДЕКАБРЯ',W/2,1765,{font:'140px Russo',skew:-0.12,scale:ds,fill:vgradDate(),stroke:'#0B1236',sw:14,shadow:'rgba(0,0,0,0.55)',sx:8,sy:10});ctx.restore();}
  const p=eOut(prog(t,1.5,0.5));if(p>0){ctx.save();ctx.globalAlpha=p;
    text((m.isHome?'ДОМА':'В ГОСТЯХ')+'  •  '+m.dow+'  •  '+(m.isHome?'МОСКВА':m.city),W/2,1850,{font:'500 34px Osw',ls:5,fill:'rgba(255,255,255,0.9)'});ctx.restore();}
}
function vgradDate(){const g=ctx.createLinearGradient(0,-110,0,10);g.addColorStop(0,'#FFF3B0');g.addColorStop(0.5,C.gold);g.addColorStop(1,C.goldD);return g;}
function intro(t){
  kb(IMG.bg_intro,t,3.6,'out');shade(0.2);
  const a=eOut(prog(t,0.2,0.7));ctx.save();ctx.globalAlpha=a;const lh=230,lw=lh*IMG.t_cska.width/IMG.t_cska.height;
  ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=30;ctx.drawImage(IMG.t_cska,W/2-lw/2,1060+(1-a)*40,lw,lh);ctx.restore();
  const r=eOut(prog(t,0.6,0.7));ctx.save();ctx.beginPath();ctx.rect(0,1330,W*r,240);ctx.clip();
  text('ДЕКАБРЬ',W/2,1500,{font:'190px Russo',skew:-0.12,fill:vgradDate(),stroke:'#0B1236',sw:16,shadow:'rgba(0,0,0,0.5)',sx:10,sy:12});ctx.restore();
  const k=eOut(prog(t,1.1,0.6));ctx.save();ctx.globalAlpha=k;
  text('КАЛЕНДАРЬ ИГР',W/2,1610,{font:'600 60px Osw',ls:14});
  text('ЖЕНСКИЙ ГАНДБОЛЬНЫЙ КЛУБ ЦСКА',W/2,1690,{font:'500 34px Osw',ls:5,fill:'rgba(255,255,255,0.8)'});ctx.restore();
  snow(t,0.6,0.8);
}
function outro(t){
  ctx.save();ctx.filter='blur(6px) brightness(0.55)';kb(IMG.bg_intro,t,5.6,'in');ctx.restore();
  ctx.fillStyle='rgba(8,12,40,0.35)';ctx.fillRect(0,0,W,H);
  const s=eBack(prog(t,0.1,0.7));if(s>0){const h=300*s,w=h*IMG.t_cska.width/IMG.t_cska.height;ctx.save();ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=40;ctx.drawImage(IMG.t_cska,W/2-w/2,330-h/2,w,h);ctx.restore();}
  const a=eOut(prog(t,0.4,0.6));ctx.save();ctx.globalAlpha=a;
  text('ВПЕРЁД, ЦСКА!',W/2,620,{font:'112px Russo',skew:-0.12,fill:vgradDate(),stroke:'#0B1236',sw:14});ctx.restore();
  MATCHES.forEach((m,i)=>{const p=eOut(prog(t,0.8+i*0.18,0.5));if(p<=0)return;const y=720+i*240;ctx.save();ctx.globalAlpha=p;ctx.translate((1-p)*-100,0);
    ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(70,y,W-140,200);ctx.fillStyle=m.isHome?C.red:C.gold;ctx.fillRect(70,y,8,200);
    text(m.day,190,y+125,{font:'100px Russo',fill:C.gold,skew:-0.1});
    text('ДЕКАБРЯ',190,y+170,{font:'600 24px Osw',ls:4});
    const opp=m.isHome?m.away:m.home;logo(opp,370,y+100,150,1,false);
    text(m.isHome?m.an:m.hn,470,y+95,{font:'700 50px Osw',align:'left',ls:2});
    text((m.isHome?'ДОМА':'В ГОСТЯХ')+' · '+m.dow,470,y+145,{font:'500 32px Osw',align:'left',ls:3,fill:'rgba(255,255,255,0.75)'});
    ctx.restore();});
  const f=eOut(prog(t,1.9,0.6));text('ЖДЁМ ВАС НА ТРИБУНАХ!',W/2,1780,{font:'600 52px Osw',ls:6,fill:'rgba(255,255,255,'+f+')'});
  snow(t,0.5,0.7);
}
const SCENES=[{d:3.6,f:intro}];
MATCHES.forEach((m,i)=>SCENES.push({d:5.4,f:(t)=>{kb(IMG[m.bg],t,5.4,m.mv);shade();snow(t+i*7,0.55,0.75);matchFg(t,m,i);}}));
SCENES.push({d:5.6,f:outro});
let acc=0;SCENES.forEach(s=>{s.s=acc;acc+=s.d;});const TOTAL=acc;
function render(T){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.letterSpacing='0px';ctx.filter='none';
  let si=SCENES.findIndex(s=>T>=s.s&&T<s.s+s.d);if(si<0)si=SCENES.length-1;const sc=SCENES[si];
  sc.f(T-sc.s);post(T);
  const TW=0.25;for(let i=1;i<SCENES.length;i++){const b=SCENES[i].s,d=Math.abs(T-b);if(d<TW){const a=1-d/TW;ctx.fillStyle=`rgba(255,250,240,${a*a})`;ctx.fillRect(0,0,W,H);}}
  if(T<0.3){ctx.fillStyle=`rgba(0,0,0,${1-T/0.3})`;ctx.fillRect(0,0,W,H);}
  if(T>TOTAL-0.5){ctx.fillStyle=`rgba(0,0,0,${(T-(TOTAL-0.5))/0.5})`;ctx.fillRect(0,0,W,H);}
}
window.TOTAL=TOTAL;
window.ready=(async()=>{makeGrain();await Promise.all([...['cska','univ','astr','luch','zvezda'].map(n=>load('t_'+n,'logos/t_'+n+'.png')),...['intro','univ','astr','luch','zvezda'].map(n=>load('bg_'+n,'bg/'+n+'.jpg'))]);
  await document.fonts.load('100px Russo','ДЕКАБРЬ 0123456789 VS/');await document.fonts.load('600 40px Osw','ДЕКАБРЬ abc');await document.fonts.ready;return TOTAL;})();
window.frame=(T)=>{render(T);return cv.toDataURL('image/jpeg',0.93);};
</script></body></html>
